title: Vivek Subramanian
tagline: Notes on LLM post-training, fine-tuning, and applied ML
description: >-
  Practitioner's notes on supervised fine-tuning, distillation, long-context
  post-training, and shipping ML to production.
author: Vivek Subramanian
email: vivek.subramanian.ml@gmail.com
url: "https://vman049.github.io"

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# GitHub Pages pins minima 2.5.1, which reads these as top-level keys.
github_username: vman049

minima:
  date_format: "%b %-d, %Y"

# Order of the links in the top nav.
header_pages:
  - about.md
  - resume.md

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - "*.docx"
  - "~$*"
